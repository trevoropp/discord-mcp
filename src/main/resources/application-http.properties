spring.ai.mcp.server.stdio=false

# STATELESS streamable-HTTP: tool calls carry no session, so a restart or redeploy of the bot
# never invalidates a client's connection (clients used to fail with "session expired" after
# every deploy and needed a manual reconnect). Both endpoint properties are set because the
# Spring AI docs name the stateless one but their example uses the streamable one.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.stateless.mcp-endpoint=/mcp
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

spring.main.web-application-type=servlet

management.endpoints.web.exposure.include=health
